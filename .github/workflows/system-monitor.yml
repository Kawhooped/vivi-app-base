name: Reality Loom System Monitor

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/system_monitor.py"
      - ".github/workflows/system-monitor.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: reality-loom-system-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run system checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/system_monitor.py
      - name: Preserve report as a CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-monitor-${{ github.run_id }}
          path: reports/system-monitor/status.json
          if-no-files-found: warn
          retention-days: 30
