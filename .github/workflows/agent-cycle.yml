name: Reality Loom Agent Cycle

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/agent-cycle.yml"
      - "tools/agent_cycle.py"

permissions:
  contents: write

concurrency:
  group: reality-loom-agent-cycle
  cancel-in-progress: false

jobs:
  repository-scout:
    name: Repository Scout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect existing project assets
        run: python tools/agent_cycle.py
      - name: Save the agent report
        run: |
          git config user.name "reality-loom-agent[bot]"
          git config user.email "reality-loom-agent[bot]@users.noreply.github.com"
          git add reports/agent-cycle/latest.md
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore(agent): update repository scout report"
            git push
          fi
